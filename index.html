<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raccolta Differenziata</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }
    .day-title {
      font-size: 1.1rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 25px;
      background: #2a2a2a;
      color: #888;
    }
    .waste-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }
    .waste-name {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .waste-desc {
      font-size: 1rem;
      color: #bbb;
      line-height: 1.4;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="day-title" id="today-name">Oggi</div>
    <div class="badge">Esporre Stasera</div>
    
    <div class="waste-icon" id="waste-icon">🗑️</div>
    <div class="waste-name" id="waste-name">Caricamento...</div>
    <div class="waste-desc" id="waste-desc"></div>
  </div>

  <div class="footer">
    Creato da <strong>PENDOLAS</strong>
  </div>

  <script>
    // Calendario basato sul giorno in cui preparare i rifiuti (STASERA) per la raccolta di DOMANI.
    // 0 = Domenica sera, 1 = Lunedì sera, ecc.
    const schedule = {
      0: { name: "Verde e Pulizia Strade", icon: "🌳🚗", desc: "Esponi il verde e attenzione al divieto per pulizia strade (Lunedì).", color: "#4caf50" }, // Dom sera -> Lun
      1: { name: "Umido e Indifferenziata", icon: "💩🗑️", desc: "Metti fuori l'organico e il bidone grigio dell'indifferenziata (Martedì).", color: "#8d6e63" }, // Lun sera -> Mar
      2: { name: "Plastica", icon: "🍾", desc: "Metti fuori il sacco giallo della plastica (Mercoledì).", color: "#fbc02d" }, // Mar sera -> Mer
      3: { name: "Carta", icon: "📰", desc: "Metti fuori il contenitore/sacco della carta (Giovedì).", color: "#1e88e5" }, // Mer sera -> Gio
      4: { name: "Umido e Vetro", icon: "💩🍾", desc: "Metti fuori l'organico e il bidone del vetro (Venerdì).", color: "#4caf50" }, // Gio sera -> Ven
      5: { name: "Nessuna Raccolta", icon: "❌", desc: "Stasera non c'è alcun rifiuto da esporre per domani.", color: "#757575" }, // Ven sera -> Sab
      6: { name: "Nessuna Raccolta", icon: "❌", desc: "Stasera non c'è alcun rifiuto da esporre per domani.", color: "#757575" }  // Sab sera -> Dom
    };

    const daysOfWeek = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

    const now = new Date();
    const currentDay = now.getDay();

    const todayElement = document.getElementById('today-name');
    const nameElement = document.getElementById('waste-name');
    const iconElement = document.getElementById('waste-icon');
    const descElement = document.getElementById('waste-desc');

    todayElement.innerText = daysOfWeek[currentDay] + " Stasera";

    const waste = schedule[currentDay];
    if (waste) {
      nameElement.innerText = waste.name;
      iconElement.innerText = waste.icon;
      descElement.innerText = waste.desc;
      nameElement.style.color = waste.color;
    }
  </script>
</body>
</html>
