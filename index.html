<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raccolta Differenziata</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }
    .day-title {
      font-size: 1.1rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 25px;
      background: #2a2a2a;
      color: #888;
    }
    .waste-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }
    .waste-name {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .waste-desc {
      font-size: 1rem;
      color: #bbb;
      line-height: 1.4;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="day-title" id="today-name">Oggi</div>
    <div class="badge">Esporre Stasera</div>
    
    <div class="waste-icon" id="waste-icon">🗑️</div>
    <div class="waste-name" id="waste-name">Caricamento...</div>
    <div class="waste-desc" id="waste-desc"></div>
  </div>

  <div class="footer">
    Creato da <strong>PENDOLAS</strong>
  </div>

  <script>
    // Tabella della raccolta differenziata in base al giorno della settimana (0 = Domenica, 1 = Lunedì, ecc.)
    // La logica mostra il rifiuto da esporre STASERA per il ritiro di DOMANI.
    const schedule = {
      0: { name: "Umido / Organico", icon: "🍏", desc: "Metti fuori il bidoncino marrone dell'umido.", color: "#8d6e63" },     // Domenica sera -> Lunedì
      1: { name: "Plastica e Metalli", icon: "🟡", desc: "Metti fuori il sacco giallo della plastica.", color: "#fbc02d" },    // Lunedì sera -> Martedì
      2: { name: "Carta e Cartone", icon: "🟦", desc: "Metti fuori il contenitore blu della carta.", color: "#1e88e5" },       // Martedì sera -> Mercoledì
      3: { name: "Secco Indifferenziato", icon: "⬛", desc: "Metti fuori il bidone grigio del secco.", color: "#757575" },     // Mercoledì sera -> Giovedì
      4: { name: "Umido / Organico", icon: "🍏", desc: "Metti fuori il bidoncino marrone dell'umido.", color: "#8d6e63" },     // Giovedì sera -> Venerdì
      5: { name: "Vetro", icon: "🟢", desc: "Metti fuori il bidone verde del vetro.", color: "#4caf50" },                     // Venerdì sera -> Sabato
      6: { name: "Nessuna Raccolta", icon: "😴", desc: "Stasera non c'è alcun rifiuto da esporre.", color: "#333333" }        // Sabato sera -> Domenica
    };

    const daysOfWeek = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

    const now = new Date();
    const currentDay = now.getDay();

    const todayElement = document.getElementById('today-name');
    const nameElement = document.getElementById('waste-name');
    const iconElement = document.getElementById('waste-icon');
    const descElement = document.getElementById('waste-desc');

    todayElement.innerText = daysOfWeek[currentDay] + " Stasera";

    const waste = schedule[currentDay];
    if (waste) {
      nameElement.innerText = waste.name;
      iconElement.innerText = waste.icon;
      descElement.innerText = waste.desc;
      nameElement.style.color = waste.color;
    }
  </script>
</body>
</html>
