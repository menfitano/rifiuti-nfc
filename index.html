<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccolta Rifiuti</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            width: 320px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .date {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 5px;
        }
        .time {
            font-size: 1rem;
            color: #777;
            margin-bottom: 20px;
        }
        .tomorrow {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }
        .waste-type {
            font-size: 1.5rem;
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .instruction {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
        <div class="tomorrow" id="tomorrow"></div>
        <div class="waste-type" id="waste-type"></div>
        <div class="icon" id="icon"></div>
        <div class="instruction" id="instruction"></div>
        <div class="footer">Creato da PENDOLAS</div>
    }

    <script>
        // Calendario della raccolta (personalizzalo con i tuoi dati)
        const calendario = {
            'Domenica': { tipo: 'Verde e Pulizia strade', icon: '🌳 🚗' },
            'Lunedì': { tipo: 'Umido e Indifferenziata', icon: '💩 🗑️' },
            'Martedì': { tipo: 'Plastica', icon: '🍾' },
            'Mercoledì': { tipo: 'Carta', icon: '📰' },
            'Giovedì': { tipo: 'Umido e Vetro', icon: '💩 🍾' },
            'Venerdì': { tipo: 'Nessuna raccolta', icon: '❌' },
            'Sabato': { tipo: 'Nessuna raccolta', icon: '❌' }
        };

        const giorniSettimana = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        function getDatiDomani() {
            const oggi = new Date();
            const domani = new Date(oggi);
            domani.setDate(oggi.getDate() + 1);
            return domani;
        }

        const domani = getDatiDomani();
        const giornoDomaniIdx = domani.getDay();
        const giornoDomaniNome = giorniSettimana[giornoDomaniIdx];
        const dataDomani = domani.getDate() + ' ' + mesi[domani.getMonth()] + ' ' + domani.getFullYear();

        const raccoltaDomani = calendario[giornoDomaniNome];

        document.getElementById('date').innerHTML = "Oggi: " + giorniSettimana[new Date().getDay()] + " " + new Date().getDate() + " " + mesi[new Date().getMonth()] + " " + new Date().getFullYear();
        document.getElementById('time').innerHTML = "Aggiornato alle: " + new Date().toLocaleTimeString('it-IT');
        document.getElementById('tomorrow').innerHTML = "DOMANI, " + giornoDomaniNome;
        document.getElementById('waste-type').innerHTML = raccoltaDomani.tipo;
        document.getElementById('icon').innerHTML = raccoltaDomani.icon;
        document.getElementById('instruction').innerHTML = "Mettere fuori: " + raccoltaDomani.tipo;
    </script>
</body>
</html>
