<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Raccolta Rifiuti</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Animazione per far lampeggiare la cornice in verde lime */
        @keyframes pulseLime {
            0% {
                border-color: #32cd32;
                box-shadow: 0 0 10px rgba(50, 205, 50, 0.3);
            }
            50% {
                border-color: #76ff03;
                box-shadow: 0 0 25px rgba(118, 255, 3, 0.8);
            }
            100% {
                border-color: #32cd32;
                box-shadow: 0 0 10px rgba(50, 205, 50, 0.3);
            }
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 4px solid #32cd32;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            /* Applicazione dell'animazione pulsante/lampeggiante */
            animation: pulseLime 2s infinite ease-in-out;
        }

        .date-section {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        .full-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: #222;
        }

        .tomorrow-day {
            font-size: 1.4rem;
            font-weight: 700;
            color: #222;
            margin-top: 5px;
        }

        .divider {
            width: 80%;
            height: 1px;
            background-color: #eee;
            margin: 15px 0;
        }

        .waste-main {
            font-size: 1.6rem;
            font-weight: bold;
            color: #222;
            text-align: center;
            margin-bottom: 15px;
        }

        .icons-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .waste-img {
            max-width: 160px;
            height: auto;
            object-fit: contain;
        }

        .instruction {
            font-size: 1.05rem;
            color: #444;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .footer {
            font-size: 0.8rem;
            color: #999;
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SEZIONE OGGI -->
        <div class="date-section">
            <span class="label">Oggi:</span>
            <div class="full-date" id="today-date-formatted"></div>
        </div>

        <div class="divider"></div>

        <!-- SEZIONE DOMANI -->
        <div class="date-section">
            <span class="label">Domani:</span>
            <div class="tomorrow-day" id="tomorrow-day-name"></div>
            <div class="full-date" id="tomorrow-date-formatted"></div>
        </div>

        <div class="divider"></div>

        <!-- DETTAGLI RACCOLTA -->
        <div class="waste-main" id="waste-type-main"></div>

        <div class="icons-container" id="waste-icons">
            <!-- Le immagini verranno inserite qui -->
        </div>

        <div class="instruction" id="waste-instruction">
            <!-- L'istruzione verrà inserita qui -->
        </div>

        <div class="footer">Creato da PENDOLAS</div>
    </div>

    <script>
        const calendarioRifiuti = {
            'Lunedì': ['Verde e Pulizia strade', ['verde-auto.png']],
            'Martedì': ['Umido e Indifferenziata', ['umido-indifferenziata.png']],
            'Mercoledì': ['Plastica', ['plastica.png']],
            'Giovedì': ['Carta', ['carta.png']],
            'Venerdì': ['Umido e Vetro', ['umido-vetro.png']],
            'Sabato': ['Nessuna raccolta', ['nieterifiuti.png']],
            'Domenica': ['Nessuna raccolta', ['nieterifiuti.png']]
        };

        const nomiGiorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const nomiMesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        function formattaDataEstesa(data) {
            const giornoNome = nomiGiorni[data.getDay()];
            const giornoNum = data.getDate();
            const meseNome = nomiMesi[data.getMonth()];
            const anno = data.getFullYear();
            return `${giornoNome} ${giornoNum} ${meseNome} ${anno}`;
        }

        const oggi = new Date();
        const domani = new Date(oggi);
        domani.setDate(oggi.getDate() + 1);

        document.getElementById('today-date-formatted').textContent = formattaDataEstesa(oggi);
        
        const nomeGiornoDomani = nomiGiorni[domani.getDay()];
        document.getElementById('tomorrow-day-name').textContent = nomeGiornoDomani.toUpperCase();
        document.getElementById('tomorrow-date-formatted').textContent = formattaDataEstesa(domani);

        const datiRaccoltaDomani = calendarioRifiuti[nomeGiornoDomani];

        if (datiRaccoltaDomani) {
            const descrizione = datiRaccoltaDomani[0];
            const immaginiArray = datiRaccoltaDomani[1];

            document.getElementById('waste-type-main').textContent = descrizione.toUpperCase();

            const containerIcone = document.getElementById('waste-icons');
            containerIcone.innerHTML = '';
            
            immaginiArray.forEach(srcImmagine => {
                const img = document.createElement('img');
                img.className = 'waste-img';
                img.src = srcImmagine;
                img.alt = descrizione;
                containerIcone.appendChild(img);
            });

            document.getElementById('waste-instruction').textContent = `Mettere fuori: ${descrizione}`;
        }
    </script>
</body>
</html>
