<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Raccolta Rifiuti</title>
    <style>
        /* Impostazioni di base per lo sfondo scuro */
        body {
            background-color: #1a1a1a; /* Grigio molto scuro come richiesto */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #f0f0f0; /* Testo chiaro di base */
        }

        /* Container principale della card */
        .container {
            width: 90%;
            max-width: 400px; /* Larghezza massima simile all'app */
            background-color: #ffffff; /* La card rimane bianca per contrasto */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); /* Ombra più definita sullo sfondo scuro */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
        }

        /* Sezione per le date (Oggi e Domani) */
        .date-section {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        /* Etichette "Oggi:" e "Domani:" */
        .label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        /* Data formattata per esteso */
        .full-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: #222; /* Testo scuro sulla card bianca */
        }

        /* Nome del giorno di domani in grande */
        .tomorrow-day {
            font-size: 1.4rem;
            font-weight: 700;
            color: #222;
            margin-top: 5px;
        }

        /* Separatori orizzontali sottili */
        .divider {
            width: 80%;
            height: 1px;
            background-color: #eee;
            margin: 15px 0;
        }

        /* Titolo principale del rifiuto in maiuscolo */
        .waste-main {
            font-size: 1.6rem;
            font-weight: bold;
            color: #222;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Container per le icone */
        .icons-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        /* Stile per le singole icone (emoji grandi) */
        .icon {
            font-size: 3.5rem;
        }

        /* Testo dell'istruzione completa */
        .instruction {
            font-size: 1.05rem;
            color: #444;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Footer con il copyright */
        .footer {
            font-size: 0.8rem;
            color: #999;
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SEZIONE OGGI -->
        <div class="date-section">
            <span class="label">Oggi:</span>
            <div class="full-date" id="today-date-formatted"></div>
        </div>

        <div class="divider"></div>

        <!-- SEZIONE DOMANI (Calcolata dinamicamente) -->
        <div class="date-section">
            <span class="label">Domani:</span>
            <div class="tomorrow-day" id="tomorrow-day-name"></div>
            <div class="full-date" id="tomorrow-date-formatted"></div>
        </div>

        <div class="divider"></div>

        <!-- DETTAGLI RACCOLTA (Popolati dinamicamente) -->
        <div class="waste-main" id="waste-type-main"></div>

        <div class="icons-container" id="waste-icons">
            <!-- Le icone verranno inserite qui dal JS -->
        </div>

        <div class="instruction" id="waste-instruction">
            <!-- L'istruzione verrà inserita qui dal JS -->
        </div>

        <div class="footer">Creato da PENDOLAS</div>
    </div>

    <script>
        // --- IL TUO CALENDARIO DEI RIFIUTI ---
        // 'Giorno': ['Descrizione Testuale', 'Icone/Emoji']
        const calendarioRifiuti = {
            'Lunedì': ['Verde e Pulizia strade', '🌳🚗'],
            'Martedì': ['Umido e Indifferenziata', '💩🗑️'],
            'Mercoledì': ['Plastica', '🍾'],
            'Giovedì': ['Carta', '📰'],
            'Venerdì': ['Umido e Vetro', '💩🍾'],
            'Sabato': ['Nessuna raccolta', '❌'],
            'Domenica': ['Nessuna raccolta', '❌']
        };

        const nomiGiorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const nomiMesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        // Funzione per formattare la data per esteso (es: Lunedì 12 Febbraio 2024)
        function formattaDataEstesa(data) {
            const giornoNome = nomiGiorni[data.getDay()];
            const giornoNum = data.getDate();
            const meseNome = nomiMesi[data.getMonth()];
            const anno = data.getFullYear();
            return `${giornoNome} ${giornoNum} ${meseNome} ${anno}`;
        }

        // --- CALCOLO DATE ---
        const oggi = new Date();
        const domani = new Date(oggi);
        domani.setDate(oggi.getDate() + 1);

        // --- AGGIORNAMENTO INTERFACCIA (OGGI E DOMANI) ---
        // Mostra la data di oggi formattata
        document.getElementById('today-date-formatted').textContent = formattaDataEstesa(oggi);
        
        // Calcola e mostra i dettagli di domani
        const nomeGiornoDomani = nomiGiorni[domani.getDay()];
        document.getElementById('tomorrow-day-name').textContent = nomeGiornoDomani.toUpperCase();
        document.getElementById('tomorrow-date-formatted').textContent = formattaDataEstesa(domani);

        // --- RECUPERO DATI RIFIUTI PER DOMANI ---
        // Cerca nel calendario il giorno corrispondente a domani
        const datiRaccoltaDomani = calendarioRifiuti[nomeGiornoDomani];

        if (datiRaccoltaDomani) {
            const descrizione = datiRaccoltaDomani[0];
            const iconeStr = datiRaccoltaDomani[1];

            // Aggiorna Titolo Principale in maiuscolo
            document.getElementById('waste-type-main').textContent = descrizione.toUpperCase();

            // Aggiorna Icone
            const containerIcone = document.getElementById('waste-icons');
            containerIcone.innerHTML = ''; // Pulisce icone precedenti
            // Split delle emoji (gestisce correttamente le emoji composte)
            const iconeArray = [...iconeStr]; 
            iconeArray.forEach(icona => {
                const span = document.createElement('span');
                span.className = 'icon';
                span.textContent = icona;
                containerIcone.appendChild(span);
            });

            // Aggiorna Istruzione Completa
            document.getElementById('waste-instruction').textContent = `Mettere fuori: ${descrizione} (${nomeGiornoDomani})`;
        }
    </script>
</body>
</html>
